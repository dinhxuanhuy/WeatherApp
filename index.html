<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherApp</title>
    <link rel="stylesheet" href="styles.css">
    <script src="./index.js" type="module"></script>
<script defer src="main.js"></script></head>
<body>
    <h1 class="header"> WeatherApp</h1>
    <h2 class ="Header-des"> A TOP project combines asynchronous function and api </h2>
    <div class ="input-container">
        <input type="text" class="input-field" placeholder="Enter city name...">
        <button class="search-button">Search</button>
    </div>
    <div class="weather-info hidden">
        <div class="weather-visualize">
            <img class="weather-icon" src="" alt="An gif representing the weather condition">           
        </div>
        <div class="weather-details">
            <h1 class="city-name">city name</h1>
            <p class="date">date</p>
            <p class="temperature">temperature</p> 
            <p class="description">description</p>
            <p class="humidity">humidity</p>
            <p class="wind-speed ">wind speed</p>
        </div>
</body>
</html>
